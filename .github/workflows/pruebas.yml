# La suite corre sola en cada push. Sin esto, 57 archivos de prueba sólo se
# ejecutan cuando alguien se acuerda — y un test que nadie corre no es un test,
# es un archivo.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Lo minimo que el trabajo necesita: leer el codigo. Sin esta declaracion hereda el
# ajuste por defecto del repositorio, que NO se puede leer desde una sesion de Claude
# — y este workflow corre en `pull_request`, o sea que lo dispara codigo de terceros.
# Declararlo aqui elimina la dependencia de un ajuste que nadie puede verificar, que
# es el motivo real para hacerlo. Auditoria de seguridad §3.2.
permissions:
  contents: read

# No ejecutar suites de commits obsoletos en paralelo: cada push nuevo a esta
# rama cancela la corrida anterior y valida el HEAD actual, evitando competir
# por Chromium/CPU y leer fallos de código que ya fue reemplazado.
concurrency:
  group: cabina-pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    # 32 y no 25: con los reintentos de apt el peor caso de la instalación son 12
    # minutos, y la compuerta tarda ~13. Con 25 el trabajo moría por su propio tope
    # justo cuando los reintentos funcionaban, que es la forma más tonta de perder
    # una corrida. Cada paso tiene además el suyo, más corto, para que un cuelgue
    # salga en rojo diciendo DÓNDE y no como un «cancelled» sin causa.
    timeout-minutes: 32
    # La compuerta es la fuente de verdad del release.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Sólo Chromium: la suite no prueba otros navegadores, y bajar los tres
      # cuesta varios minutos por corrida sin comprobar nada más.
      #
      # EL PASO VA PARTIDO EN DOS A PROPÓSITO, porque sus dos mitades fallan de
      # formas distintas y sólo una se cae:
      #
      #   · bajar el navegador habla con el CDN de Playwright y nunca ha fallado;
      #   · `--with-deps` llama a `apt-get`, y un espejo que deja de contestar no
      #     falla: se queda colgado.
      #
      # Juntas, una caída del espejo se llevaba por delante el navegador también.
      # Pasó dos veces medidas en este repositorio: en la PR #5 el espejo de Azure
      # dejó de responder y el paso esperó hasta que el tope de 25 minutos del
      # TRABAJO canceló todo —en la interfaz eso se lee «cancelled», que parece un
      # fallo de la suite y no lo es—; y en la PR #13, ya con tope propio, murió a
      # los 6 minutos con `Ign: ... azure.archive.ubuntu.com` repetido seis veces.
      # Las dos veces sin haber corrido una sola prueba.
      #
      # Partido, el navegador se baja siempre, y el espejo tiene tres intentos con
      # espera creciente antes de darse por vencido. No arregla el espejo —no es
      # nuestro—: hace que una caída pasajera no cueste una corrida entera.
      - name: Bajar Chromium
        timeout-minutes: 4
        run: npx playwright install chromium

      - name: Dependencias del sistema para Chromium
        # 18 min es el TOPE DURO del runner, y no debería dispararse nunca: el
        # presupuesto interno son 15 min y se respeta solo. Si este tope salta,
        # es que el presupuesto dejó de cuadrar otra vez — ver abajo.
        timeout-minutes: 18
        run: |
          # SE ESPERA EL LOCK, NO SE DUERME A CIEGAS.
          #
          # Qué falló la primera vez: la corrida de `c4b6557` en main agotó los
          # tres intentos con «E: Unable to acquire the dpkg frontend lock». La
          # imagen del runner arranca `unattended-upgrades`, que puede retener
          # ese lock varios minutos; los sleeps de 20/40/60 s suman ~2 min y se
          # quedaron cortos. Consecuencia: el paso de la compuerta quedó
          # SKIPPED, main se puso rojo sin que corriera UNA SOLA prueba, y
          # `pagina.yml` no desplegó. Un rojo que no mide nada es el peor tipo
          # de rojo: cuesta lo mismo que uno real y no dice nada.
          #
          # Y QUÉ FALLÓ LA SEGUNDA, que es por lo que esto está reescrito. El
          # arreglo de entonces —esperar el lock hasta 6 min— se sumó a los
          # tres intentos sin recalcular el tope del paso, que seguía en 12 min:
          #
          #     3 intentos × (360 s de espera + 180 s de apt) + 60 s de sleeps
          #       = hasta 1680 s   contra un tope de 720 s
          #
          # O sea que el intento 3 NUNCA podía llegar a ejecutarse, y el paso no
          # fallaba: lo MATABA el runner a mitad de una espera. Medido en la
          # corrida 40310728511: aviso del intento 2 a las 11:03:11 y muerte por
          # tope a las 11:06:01, dentro de la espera del intento 3. Un «timed
          # out after 12 minutes» no dice qué pasaba; el log de arriba sí.
          #
          # Por eso ahora hay UN SOLO PRESUPUESTO y todo lo demás se deriva de
          # él: cada espera se corta contra lo que queda, así que el total no
          # puede pasarse por construcción. Añadir un cuarto intento no vuelve a
          # romper la aritmética — sencillamente no cabrá, y lo dirá.
          #
          # Lo que NO cambia es el final: si apt no responde, el paso falla duro
          # y no se desactiva nada. La suite no corre con dependencias a medias.
          PRESUPUESTO=900   # 15 min para TODO este paso
          MARGEN=60         # por debajo de esto no se empieza algo que no cabe
          PASO=5            # cada cuánto se pregunta por el lock
          APT_TOPE=180      # lo máximo que se le da a un intento de apt
          FIN=$(( SECONDS + PRESUPUESTO ))
          restante() { echo $(( FIN - SECONDS )); }
          lock_tomado() {
            sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1
          }
          espera_lock() {
            while [ "$(restante)" -gt "$MARGEN" ]; do
              lock_tomado || return 0
              sleep "$PASO"
            done
            echo "::warning::el lock de dpkg sigue tomado y quedan $(restante) s de presupuesto; se intenta de todos modos"
          }
          for i in 1 2 3; do
            if [ "$(restante)" -le "$MARGEN" ]; then
              echo "::warning::sin presupuesto para el intento $i; no se empieza algo que no cabe"
              break
            fi
            espera_lock
            t=$(restante); [ "$t" -gt "$APT_TOPE" ] && t=$APT_TOPE
            if timeout "$t" npx playwright install-deps chromium; then exit 0; fi
            espera=$(( i * 20 )); r=$(( $(restante) - MARGEN ))
            [ "$r" -lt 0 ] && r=0
            [ "$espera" -gt "$r" ] && espera=$r
            echo "::warning::intento $i de apt fallado o colgado; reintento en $espera s"
            sleep "$espera"
          done
          echo "::error::apt no respondió dentro del presupuesto de $PRESUPUESTO s, y el paso no midió nada."
          echo "::error::No se desactiva nada: si a Chromium le falta una biblioteca, la suite lo dirá al arrancar."
          exit 1

      # npm run compuerta, no npm test: la compuerta LANZA la suite una sola vez
      # (correr.mjs como proceso hijo) y todas sus filas dependientes de pruebas
      # derivan de ESA salida. No cuesta una corrida extra. Lo que suma es la
      # tabla de la cadena fuente -> motor -> bundle -> index.html -> pages, y
      # sobre todo las cuatro filas UNKNOWN: fronteras que CI no puede comprobar
      # y que quedan NOMBRADAS en el log en vez de omitidas. Sale 1 si hay una
      # fila en FAIL; una fila UNKNOWN nunca afecta al codigo de salida.
      - name: Correr la compuerta (incluye la suite entera)
        run: npm run compuerta
