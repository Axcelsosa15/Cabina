# Publica index.html como página viva en GitHub Pages.
#
# Se dispara DESPUÉS de que `pruebas` termine en verde, no en cada push. Un push
# rojo no debe llegar a la página: si la suite falla, aquí no se despliega nada y
# lo que haya publicado sigue siendo la última versión que pasó.
name: pagina

on:
  workflow_run:
    workflows: [pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` porque cortar un despliegue
# a medias puede dejar la página en un estado intermedio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # En workflow_dispatch no hay conclusión que mirar; en workflow_run sí.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # workflow_run puede terminar después de que main ya haya avanzado.
          # Publicamos EXACTAMENTE el commit que produjo el verde de pruebas.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      # Pages está activado (Settings → Pages → Source: GitHub Actions). Si alguien
      # lo desactivara, este paso falla en rojo: es una regresión de producción,
      # no un aviso.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Sólo lo que la página necesita, así que test/ y engine/ no acaban
      # servidos. index.html FUE autosuficiente hasta que se añadió la imagen
      # para compartir: og.png vive en el repositorio a propósito —para no
      # depender de un servidor ajeno— y por tanto hay que publicarla.
      - name: Armar lo que se publica
        run: |
          mkdir -p sitio
          cp index.html sitio/index.html
          cp .nojekyll sitio/.nojekyll
          cp og.png sitio/og.png
          cp cabina-refinement.css sitio/cabina-refinement.css
          python3 - <<'PY'
          from pathlib import Path
          page = Path("sitio/index.html")
          html = page.read_text()
          link = '  <link rel="stylesheet" href="./cabina-refinement.css">\n'
          if "cabina-refinement.css" not in html:
              if "</head>" not in html:
                  raise SystemExit("No se encontró </head> para insertar la hoja de estilos")
              html = html.replace("</head>", link + "</head>", 1)
          page.write_text(html)
          PY
          ls -la sitio

      # EL FALLO QUE ESTE PASO EXISTE PARA IMPEDIR, Y QUE YA OCURRIÓ UNA VEZ:
      # se añadió `og:image` apuntando a og.png, la imagen se commiteó, la suite
      # pasó en verde y Pages sirvió un 404 durante horas. Nadie se enteró porque
      # la comprobación de abajo sólo mira index.html, y el enlace compartido no
      # se rompe de forma visible: sale sin imagen y ya está.
      #
      # Se recorre index.html buscando URL absolutas al propio sitio y se exige
      # que cada fichero esté dentro de `sitio/`. Copiar un fichero nuevo al
      # repositorio y olvidarse de copiarlo aquí vuelve a ser imposible.
      - name: Todo lo que index.html pide del propio sitio está publicado
        run: |
          faltan=0
          for ruta in $(grep -oE 'https://axcelsosa15\.github\.io/Cabina/[A-Za-z0-9_./-]+' index.html \
                        | sed 's|https://axcelsosa15.github.io/Cabina/||' | sort -u); do
            [ -z "$ruta" ] && continue
            if [ -f "sitio/$ruta" ]; then
              echo "✅ $ruta publicado"
            else
              echo "::error::index.html pide $ruta y no está en sitio/"
              faltan=1
            fi
          done
          if [ ! -f sitio/cabina-refinement.css ]; then
            echo "::error::cabina-refinement.css no está en el artefacto de publicación"
            faltan=1
          else
            echo "✅ cabina-refinement.css publicado"
          fi
          exit $faltan

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: sitio

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # LO PUBLICADO ES LO PROBADO. El checkout anterior está fijado al head_sha
      # de la ejecución de pruebas que disparó este workflow, no al main actual.
      # Se pide la URL real y se compara byte a byte
      # con el index.html que acaba de pasar la suite. El CDN tarda unos segundos
      # en servir la versión nueva: hasta un minuto de reintentos.
      - name: La página publicada es exactamente index.html
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          for i in $(seq 1 12); do
            if curl -fsSL "$url" -o publicado.html && cmp -s publicado.html sitio/index.html; then
              echo "✅ $url sirve exactamente el HTML generado y probado ($(wc -c < index.html) bytes)"
              echo "✅ $url sirve exactamente el index.html probado" >> "$GITHUB_STEP_SUMMARY"
              # Y la imagen para compartir responde de verdad, no sólo existe en
              # el repositorio. Es lo que faltaba la vez que dio 404.
              if ! curl -fsS -o /dev/null "${url%/}/og.png"; then
                echo "::error::${url%/}/og.png no responde: el enlace compartido saldrá sin imagen"
                exit 1
              fi
              echo "✅ ${url%/}/og.png responde"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url no sirve el HTML generado de este commit"
          exit 1
