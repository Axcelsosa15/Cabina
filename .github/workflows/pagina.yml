# Publica index.html como página viva en GitHub Pages.
#
# Se dispara DESPUÉS de que `pruebas` termine en verde, no en cada push. Un push
# rojo no debe llegar a la página: si la suite falla, aquí no se despliega nada y
# lo que haya publicado sigue siendo la última versión que pasó.
name: pagina

on:
  workflow_run:
    workflows: [pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` porque cortar un despliegue
# a medias puede dejar la página en un estado intermedio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # En workflow_dispatch no hay conclusión que mirar; en workflow_run sí.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # workflow_run puede terminar después de que main ya haya avanzado.
          # Publicamos EXACTAMENTE el commit que produjo el verde de pruebas.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      # Pages está activado (Settings → Pages → Source: GitHub Actions). Si alguien
      # lo desactivara, este paso falla en rojo: es una regresión de producción,
      # no un aviso.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Sólo lo que la página necesita, así que test/ y engine/ no acaban
      # servidos. index.html FUE autosuficiente hasta que se añadió la imagen
      # para compartir: og.png vive en el repositorio a propósito —para no
      # depender de un servidor ajeno— y por tanto hay que publicarla.
      #
      # LO QUE AQUÍ SE DEJÓ DE HACER, Y POR QUÉ. Este paso inyectaba
      # `<link rel="stylesheet" href="./cabina-refinement.css">` en el HTML
      # publicado. La CSP de la página declara
      # `style-src 'unsafe-inline' https://fonts.googleapis.com`: sin 'self',
      # el navegador RECHAZA esa hoja. Medido en Chromium contra este mismo
      # artefacto: «Refused to load the stylesheet ... because it violates the
      # following Content Security Policy directive», requestfailed con
      # errorText `csp`, y `scroll-padding-top` del <html> en `auto` cuando la
      # hoja declara 24px. Las 441 líneas no llegaban a pintar NADA.
      # La verificación de más abajo decía «✅ responde» porque hacía `curl`,
      # y curl no aplica CSP: comprobaba que el fichero se sirve, no que el
      # navegador lo use. Un verde que medía lo que no era.
      # Y lo peor: la inyección ocurría SÓLO aquí, así que el payload publicado
      # no era el que prueban humo.mjs ni seguridad.mjs. «Lo publicado es lo
      # probado» dejaba de ser cierto justo en el fichero que nadie miraba.
      # Ahora `sitio/index.html` es copia byte a byte de lo que corre la suite.
      # Lo vigila test/hojas.mjs.
      - name: Armar lo que se publica
        run: |
          mkdir -p sitio sitio/.well-known
          cp index.html sitio/index.html
          # LA APLICACION. Desde que el script salio de index.html para que la
          # CSP pueda prohibir el inline, la pagina sin este fichero es un
          # cascaron: pinta la cabecera y nada mas. Se verifica byte a byte
          # abajo, igual que el HTML.
          cp app.js sitio/app.js
          cp appearance.js sitio/appearance.js
          cp discipline.js sitio/discipline.js
          cp session-break.js sitio/session-break.js
          cp experience.js sitio/experience.js
          cp .nojekyll sitio/.nojekyll
          cp og.png sitio/og.png
          # EL CASCO SIN CONEXION. index.html dejo de ser autosuficiente el dia
          # que se pudo instalar: el trabajador de servicio y el manifiesto son
          # ficheros del propio origen, y sin publicarlos la pagina instalada
          # simplemente no existe. Los iconos salen del mismo dibujo que el
          # favicon. Que esta lista y la de `sw.js` no diverjan lo vigila
          # test/pwa.mjs, no la buena memoria de nadie.
          cp sw.js manifest.webmanifest sitio/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png sitio/
          # Las tres paginas legales, el sitemap, robots y el security.txt. Son
          # ficheros de texto sin JavaScript; cada uno se comprueba abajo.
          cp privacidad.html terminos.html seguridad.html sitio/
          cp robots.txt sitemap.xml sitio/
          cp .well-known/security.txt sitio/.well-known/security.txt
          ls -la sitio sitio/.well-known

      # EL FALLO QUE ESTE PASO EXISTE PARA IMPEDIR, Y QUE YA OCURRIÓ UNA VEZ:
      # se añadió `og:image` apuntando a og.png, la imagen se commiteó, la suite
      # pasó en verde y Pages sirvió un 404 durante horas. Nadie se enteró porque
      # la comprobación de abajo sólo mira index.html, y el enlace compartido no
      # se rompe de forma visible: sale sin imagen y ya está.
      #
      # Se recorre index.html buscando URL absolutas al propio sitio y se exige
      # que cada fichero esté dentro de `sitio/`. Copiar un fichero nuevo al
      # repositorio y olvidarse de copiarlo aquí vuelve a ser imposible.
      #
      # EL DOMINIO NO SE ESCRIBE AQUI, Y ESTA ES LA RAZON. Este paso tenia el
      # host de GitHub Pages incrustado en el `grep`. El dia que index.html pasó
      # a su dominio propio, el patrón dejó de coincidir con NADA: el bucle no
      # iteraba una sola vez, `faltan` se quedaba en 0 y el paso salía en verde
      # habiendo comprobado cero ficheros. Un verde que medía lo que no era,
      # justo en el guardián escrito para que el 404 de og.png no se repitiera.
      # Ahora el origen se LEE de `rel=canonical`, que es donde la decisión
      # existe de verdad, y una lista vacía es ROJO: si este paso no tiene nada
      # que comprobar, el que falló es el paso, no el despliegue.
      - name: Todo lo que index.html pide del propio sitio está publicado
        run: |
          base="$(grep -oE 'rel="canonical" href="https?://[^"]+"' index.html \
                  | head -1 | sed 's|.*href="||;s|"$||')"
          if [ -z "$base" ]; then
            echo "::error::index.html no declara rel=canonical: no se puede saber qué URL son del propio sitio"
            exit 1
          fi
          base="${base%/}"
          echo "Origen propio, leído de rel=canonical: $base"
          # El `.` del host queda como metacaracter en los dos patrones. Da igual:
          # sobre-coincidir dentro de una URL del propio sitio no cambia la ruta
          # extraida, y lo que importa es que una lista VACIA no pase.
          rutas="$(grep -oE "$base/[A-Za-z0-9_./-]+" index.html | sed "s|^$base/||" | sort -u)"
          if [ -z "$rutas" ]; then
            echo "::error::ninguna URL absoluta a $base en index.html: este paso no estaría comprobando nada"
            exit 1
          fi
          faltan=0
          for ruta in $rutas; do
            if [ -f "sitio/$ruta" ]; then
              echo "✅ $ruta publicado"
            else
              echo "::error::index.html pide $ruta y no está en sitio/"
              faltan=1
            fi
          done
          exit $faltan

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: sitio

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verificar que www apunta a GitHub Pages
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
          PAGES_OWNER: ${{ github.repository_owner }}
        run: node .github/scripts/verifica-dns-pages.mjs

      # LO PUBLICADO ES LO PROBADO. Pages/CDN puede tardar en propagar
      # el deployment; se usa una URL sin caché y un hash para evitar falsos rojos
      # y para mostrar qué versión responde realmente.
      # CADA FICHERO DEL CASCO RESPONDE, NO SOLO LA PAGINA.
      # El fallo que esto impide ya ocurrio una vez con og.png: se referencio,
      # se commiteo, la suite paso en verde y Pages sirvio un 404 durante horas
      # porque nadie lo habia copiado a sitio/. Con el manifiesto el sintoma
      # seria peor y mas callado: la pagina se ve bien y simplemente no se puede
      # instalar, que es justo lo que nadie prueba a mano.
      - name: Todo el casco responde en la URL publicada
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          faltan=0
          for f in sw.js manifest.webmanifest icon-192.png icon-512.png \
                   icon-maskable-512.png apple-touch-icon.png \
                   privacidad.html terminos.html seguridad.html \
                   robots.txt sitemap.xml .well-known/security.txt og.png; do
            if status="$(curl -fsSL --max-redirs 5 --max-time 20 -H 'Cache-Control: no-cache' -o /dev/null \
                 -w '%{http_code}' "${url%/}/$f?cabina_verify=${GITHUB_RUN_ID}")" && [ "$status" = 200 ]; then
              echo "✅ $f responde"
            else
              echo "::error::${url%/}/$f no responde: lo publicado está incompleto"
              faltan=1
            fi
          done
          exit $faltan

      # QUIEN CONTESTA EN EL DOMINIO, ANTES DE AFIRMAR NADA SOBRE EL.
      # El paso de abajo compara el sha256 de lo servido en `page_url` con el de
      # `sitio/index.html` y, si coinciden, escribe «lo publicado es lo probado».
      # Esa frase solo es cierta si quien contesta en esa URL es ESTE
      # despliegue. Y este repositorio tiene TRES caminos de publicacion
      # configurados a la vez: Pages por este workflow, un proyecto de Vercel
      # que publica checks en cada PR, y `netlify.toml`. Los tres servirian el
      # MISMO index.html byte a byte para el mismo commit, asi que el hash
      # coincide igual y la comparacion no distingue de quien viene: el verde
      # mediria a un tercero ponerse al dia, no que lo subido aqui se sirva.
      #
      # Ya paso, y esta medido. El 5 de noviembre de 2026 el run 204 fallo tras
      # 180 s: el dominio servia el index.html de #142 (sha256 87bfb874...)
      # mientras este workflow acababa de desplegar #143 (99173df2...). Veinte
      # minutos despues el run 205 salio verde sin que nadie tocara nada.
      #
      # Asi que se pregunta por las cabeceras. Si contesta Pages, el paso de
      # abajo verifica lo que dice verificar. Si contesta otro, esto se pone
      # ROJO nombrandolo, y «quien sirve el dominio» deja de ser una suposicion.
      - name: Quien sirve el dominio publicado es este despliegue
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          case "$url" in
            http://*) echo "::warning::$url se anuncia por http, no https: Pages no tiene certificado para este dominio, que suele ser la señal de que su DNS no apunta a Pages" ;;
          esac
          if ! curl -sS -L --max-time 30 -o /dev/null -D cabeceras.txt \
                 -H 'Cache-Control: no-cache' "${url}?cabina_host=${GITHUB_RUN_ID}"; then
            echo "::error::$url no responde: no se puede saber quien lo sirve"
            exit 1
          fi
          # Con -L el fichero lleva las cabeceras de CADA salto. Solo importa
          # quien contesta al final, asi que se recorta al ultimo bloque: un
          # redirect desde Pages hacia el dominio propio dejaria sus cabeceras
          # arriba y daria un «lo sirve Pages» falso.
          tr -d '\r' < cabeceras.txt | awk 'BEGIN{RS=""} {b=$0} END{print b}' > ultimas.txt
          echo "--- cabeceras de quien contesta ---"
          grep -iE '^(HTTP/|server|x-github-request-id|x-vercel-id|x-nf-request-id|via):' ultimas.txt || true
          quien=desconocido
          if   grep -qiE '^server:[[:space:]]*github\.com' ultimas.txt || grep -qi '^x-github-request-id:' ultimas.txt; then quien="GitHub Pages"
          elif grep -qi  '^x-vercel-id:' ultimas.txt || grep -qiE '^server:[[:space:]]*vercel' ultimas.txt; then quien="Vercel"
          elif grep -qi  '^x-nf-request-id:' ultimas.txt || grep -qiE '^server:[[:space:]]*netlify' ultimas.txt; then quien="Netlify"
          fi
          if [ "$quien" = "GitHub Pages" ]; then
            echo "✅ $url lo sirve GitHub Pages: lo que compara el paso siguiente es este despliegue"
            echo "✅ $url lo sirve GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::$url lo sirve $quien, no GitHub Pages. El paso siguiente compararia el HTML de OTRO host, asi que su verde no significaria «lo publicado es lo probado». Elige un solo camino de publicacion (este workflow, el proyecto de Vercel, o netlify.toml) y retira los otros dos."
          exit 1

      - name: La página publicada es exactamente index.html
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          esperado="$(sha256sum sitio/index.html | cut -d' ' -f1)"
          for i in $(seq 1 36); do
            probe="${url}?cabina_verify=${GITHUB_RUN_ID}-${i}"
            if curl -fsSL -H 'Cache-Control: no-cache' "$probe" -o publicado.html; then
              recibido="$(sha256sum publicado.html | cut -d' ' -f1)"
              if [ "$recibido" = "$esperado" ]; then
                echo "✅ $url sirve exactamente el HTML generado y probado (sha256 $recibido)"
                echo "✅ $url sirve exactamente el HTML generado y probado" >> "$GITHUB_STEP_SUMMARY"
                # Y LA APLICACION, con el mismo rigor. El HTML sin app.js es un
                # cascaron, asi que verificar solo el HTML dejaria de significar
                # «lo publicado es lo probado» justo en el fichero que ahora
                # lleva las 15.000 lineas. Mismo hash, misma exigencia.
                espapp="$(sha256sum sitio/app.js | cut -d' ' -f1)"
                if ! curl -fsSL -H 'Cache-Control: no-cache' "${url%/}/app.js?cabina_verify=${GITHUB_RUN_ID}" -o publicado.js; then
                  echo "::error::${url%/}/app.js no responde: la página publicada no arranca"
                  exit 1
                fi
                recapp="$(sha256sum publicado.js | cut -d' ' -f1)"
                if [ "$recapp" != "$espapp" ]; then
                  echo "::error::app.js servido ($recapp) no es el probado ($espapp)"
                  exit 1
                fi
                echo "✅ ${url%/}/app.js es exactamente el probado (sha256 $recapp)"
                exit 0
              fi
              echo "Propagación pendiente ($i/36): esperado=$esperado servido=$recibido"
            else
              echo "Página todavía no responde ($i/36)"
            fi
            sleep 5
          done
          echo "::error::$url no sirve el HTML generado de este commit tras 180 segundos"
          exit 1
