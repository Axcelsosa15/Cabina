# Publica index.html como página viva en GitHub Pages.
#
# Se dispara DESPUÉS de que `pruebas` termine en verde, no en cada push. Un push
# rojo no debe llegar a la página: si la suite falla, aquí no se despliega nada y
# lo que haya publicado sigue siendo la última versión que pasó.
name: pagina

on:
  workflow_run:
    workflows: [pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` porque cortar un despliegue
# a medias puede dejar la página en un estado intermedio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # En workflow_dispatch no hay conclusión que mirar; en workflow_run sí.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # workflow_run puede terminar después de que main ya haya avanzado.
          # Publicamos EXACTAMENTE el commit que produjo el verde de pruebas.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      # Pages está activado (Settings → Pages → Source: GitHub Actions). Si alguien
      # lo desactivara, este paso falla en rojo: es una regresión de producción,
      # no un aviso.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Sólo lo que la página necesita, así que test/ y engine/ no acaban
      # servidos. index.html FUE autosuficiente hasta que se añadió la imagen
      # para compartir: og.png vive en el repositorio a propósito —para no
      # depender de un servidor ajeno— y por tanto hay que publicarla.
      #
      # LO QUE AQUÍ SE DEJÓ DE HACER, Y POR QUÉ. Este paso inyectaba
      # `<link rel="stylesheet" href="./cabina-refinement.css">` en el HTML
      # publicado. La CSP de la página declara
      # `style-src 'unsafe-inline' https://fonts.googleapis.com`: sin 'self',
      # el navegador RECHAZA esa hoja. Medido en Chromium contra este mismo
      # artefacto: «Refused to load the stylesheet ... because it violates the
      # following Content Security Policy directive», requestfailed con
      # errorText `csp`, y `scroll-padding-top` del <html> en `auto` cuando la
      # hoja declara 24px. Las 441 líneas no llegaban a pintar NADA.
      # La verificación de más abajo decía «✅ responde» porque hacía `curl`,
      # y curl no aplica CSP: comprobaba que el fichero se sirve, no que el
      # navegador lo use. Un verde que medía lo que no era.
      # Y lo peor: la inyección ocurría SÓLO aquí, así que el payload publicado
      # no era el que prueban humo.mjs ni seguridad.mjs. «Lo publicado es lo
      # probado» dejaba de ser cierto justo en el fichero que nadie miraba.
      # Ahora `sitio/index.html` es copia byte a byte de lo que corre la suite.
      # Lo vigila test/hojas.mjs.
      - name: Armar lo que se publica
        run: |
          mkdir -p sitio sitio/.well-known
          cp index.html sitio/index.html
          cp .nojekyll sitio/.nojekyll
          cp og.png sitio/og.png
          # EL CASCO SIN CONEXION. index.html dejo de ser autosuficiente el dia
          # que se pudo instalar: el trabajador de servicio y el manifiesto son
          # ficheros del propio origen, y sin publicarlos la pagina instalada
          # simplemente no existe. Los iconos salen del mismo dibujo que el
          # favicon. Que esta lista y la de `sw.js` no diverjan lo vigila
          # test/pwa.mjs, no la buena memoria de nadie.
          cp sw.js manifest.webmanifest sitio/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png sitio/
          # Las tres paginas legales, el sitemap, robots y el security.txt. Son
          # ficheros de texto sin JavaScript; cada uno se comprueba abajo.
          cp privacidad.html terminos.html seguridad.html sitio/
          cp robots.txt sitemap.xml sitio/
          cp .well-known/security.txt sitio/.well-known/security.txt
          ls -la sitio sitio/.well-known

      # EL FALLO QUE ESTE PASO EXISTE PARA IMPEDIR, Y QUE YA OCURRIÓ UNA VEZ:
      # se añadió `og:image` apuntando a og.png, la imagen se commiteó, la suite
      # pasó en verde y Pages sirvió un 404 durante horas. Nadie se enteró porque
      # la comprobación de abajo sólo mira index.html, y el enlace compartido no
      # se rompe de forma visible: sale sin imagen y ya está.
      #
      # Se recorre index.html buscando URL absolutas al propio sitio y se exige
      # que cada fichero esté dentro de `sitio/`. Copiar un fichero nuevo al
      # repositorio y olvidarse de copiarlo aquí vuelve a ser imposible.
      - name: Todo lo que index.html pide del propio sitio está publicado
        run: |
          faltan=0
          for ruta in $(grep -oE 'https://axcelsosa15\.github\.io/Cabina/[A-Za-z0-9_./-]+' index.html \
                        | sed 's|https://axcelsosa15.github.io/Cabina/||' | sort -u); do
            [ -z "$ruta" ] && continue
            if [ -f "sitio/$ruta" ]; then
              echo "✅ $ruta publicado"
            else
              echo "::error::index.html pide $ruta y no está en sitio/"
              faltan=1
            fi
          done
          exit $faltan

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: sitio

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # LO PUBLICADO ES LO PROBADO. Pages/CDN puede tardar en propagar
      # el deployment; se usa una URL sin caché y un hash para evitar falsos rojos
      # y para mostrar qué versión responde realmente.
      # CADA FICHERO DEL CASCO RESPONDE, NO SOLO LA PAGINA.
      # El fallo que esto impide ya ocurrio una vez con og.png: se referencio,
      # se commiteo, la suite paso en verde y Pages sirvio un 404 durante horas
      # porque nadie lo habia copiado a sitio/. Con el manifiesto el sintoma
      # seria peor y mas callado: la pagina se ve bien y simplemente no se puede
      # instalar, que es justo lo que nadie prueba a mano.
      - name: Todo el casco responde en la URL publicada
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          faltan=0
          for f in sw.js manifest.webmanifest icon-192.png icon-512.png \
                   icon-maskable-512.png apple-touch-icon.png \
                   privacidad.html terminos.html seguridad.html \
                   robots.txt sitemap.xml .well-known/security.txt; do
            if curl -fsS -H 'Cache-Control: no-cache' -o /dev/null \
                 "${url%/}/$f?cabina_verify=${GITHUB_RUN_ID}"; then
              echo "✅ $f responde"
            else
              echo "::error::${url%/}/$f no responde: lo publicado está incompleto"
              faltan=1
            fi
          done
          exit $faltan

      - name: La página publicada es exactamente index.html
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          esperado="$(sha256sum sitio/index.html | cut -d' ' -f1)"
          for i in $(seq 1 36); do
            probe="${url}?cabina_verify=${GITHUB_RUN_ID}-${i}"
            if curl -fsSL -H 'Cache-Control: no-cache' "$probe" -o publicado.html; then
              recibido="$(sha256sum publicado.html | cut -d' ' -f1)"
              if [ "$recibido" = "$esperado" ]; then
                echo "✅ $url sirve exactamente el HTML generado y probado (sha256 $recibido)"
                echo "✅ $url sirve exactamente el HTML generado y probado" >> "$GITHUB_STEP_SUMMARY"
                if ! curl -fsS -H 'Cache-Control: no-cache' -o /dev/null "${url%/}/og.png?cabina_verify=${GITHUB_RUN_ID}"; then
                  echo "::error::${url%/}/og.png no responde: el enlace compartido saldrá sin imagen"
                  exit 1
                fi
                echo "✅ ${url%/}/og.png responde"
                exit 0
              fi
              echo "Propagación pendiente ($i/36): esperado=$esperado servido=$recibido"
            else
              echo "Página todavía no responde ($i/36)"
            fi
            sleep 5
          done
          echo "::error::$url no sirve el HTML generado de este commit tras 180 segundos"
          exit 1
