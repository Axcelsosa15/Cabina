# La página son index.html y app.js, ninguno con hash en el nombre: el navegador
# revalida siempre y la CDN sirve la copia vieja mientras trae la nueva.
# app.js entra por la regla `/*` de abajo, y eso importa: lleva la aplicación
# entera, así que servir una copia vieja sería servir una versión vieja de las
# reglas. Si algún día se le pone caché larga, hay que ponerle hash primero.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# og.png y el bundle del motor no llevan hash: un día en el navegador, no un año,
# para que un cambio llegue sin renombrar el fichero.
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
